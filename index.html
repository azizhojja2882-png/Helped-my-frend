<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apk Qo'riqchi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0e12;
            color: #ffffff;
            touch-action: manipulation;
        }

        /* Circular Progress Styling */
        .circle-bg {
            fill: none;
            stroke: #252830;
            stroke-width: 8;
        }
        
        .circle-progress {
            fill: none;
            stroke: url(#orange-gradient);
            stroke-width: 8;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.8s ease-in-out;
        }

        .glow-effect {
            filter: drop-shadow(0px 0px 15px rgba(255, 107, 0, 0.4));
        }

        /* Pulse scan effect */
        @keyframes radar-pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.3;
            }
            100% {
                transform: scale(0.95);
                opacity: 0.8;
            }
        }

        .scanning-pulse {
            animation: radar-pulse 1.8s infinite ease-in-out;
        }

        /* Custom scrollbar for mobile frame */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2d36;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 bg-[#050507]">

    <!-- Mobile Screen Frame Container -->
    <div class="w-full max-w-[412px] h-[100vh] sm:h-[840px] bg-[#0d0e12] sm:rounded-[36px] border-0 sm:border-8 sm:border-[#1e2029] shadow-2xl flex flex-col justify-between overflow-hidden relative select-none">
        
        <!-- Status Bar Fake (Mobile view mimic) -->
        <div class="flex justify-between items-center px-6 pt-3 text-xs text-gray-400 font-medium">
            <span id="current-time">15:50</span>
            <div class="flex items-center gap-1.5">
                <!-- Signal & Battery Icons -->
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.2C2.89 16.48 2 14.34 2 12c0-5.52 4.48-10 10-10s10 4.48 10 10c0 2.34-.89 4.48-2.35 6.2l-1.34-.59C19.26 16.07 20 14.12 20 12c0-4.97-4.03-9-9-9z"/></svg>
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.2C2.89 16.48 2 14.34 2 12c0-5.52 4.48-10 10-10s10 4.48 10 10c0 2.34-.89 4.48-2.35 6.2l-1.34-.59C19.26 16.07 20 14.12 20 12c0-4.97-4.03-9-9-9z"/></svg>
                <span class="text-[10px]">34%</span>
            </div>
        </div>

        <!-- App Header -->
        <div class="flex items-center justify-between px-6 pt-4 pb-2">
            <h1 class="text-2xl font-bold text-white tracking-wide">Apk Qo'riqchi</h1>
            <button id="settings-btn" class="p-2 rounded-full hover:bg-white/5 active:scale-95 transition-all text-gray-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
        </div>

        <!-- Main Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-5 py-2 flex flex-col justify-around">

            <!-- Circular Security Progress Gauge -->
            <div class="flex flex-col items-center justify-center my-2 relative">
                <div id="pulse-ring" class="absolute w-[220px] h-[220px] rounded-full bg-orange-600/10 blur-xl pointer-events-none transition-all duration-500"></div>
                
                <div class="relative w-56 h-56 flex items-center justify-center">
                    <svg class="w-full h-full glow-effect" viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="orange-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FF9500" />
                                <stop offset="100%" stop-color="#FF3B00" />
                            </linearGradient>
                        </defs>
                        <!-- Background Circle -->
                        <circle class="circle-bg" cx="50" cy="50" r="42"></circle>
                        <!-- Animated Progress Circle -->
                        <circle id="progress-circle" class="circle-progress" cx="50" cy="50" r="42" 
                                stroke-dasharray="263.89" 
                                stroke-dashoffset="21.11"></circle>
                    </svg>

                    <!-- Center Shield Content -->
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <!-- Orange Shield Badge -->
                        <div id="center-shield" class="w-11 h-11 bg-gradient-to-b from-[#FF8800] to-[#FF5500] rounded-xl flex items-center justify-center shadow-lg shadow-orange-500/30 mb-2 transition-transform duration-300">
                            <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 .01 0 .01z"/>
                            </svg>
                        </div>
                        <span class="text-xs text-gray-300 font-medium tracking-wide">Анализ безопасности</span>
                        <span id="score-percentage" class="text-3xl font-extrabold text-white tracking-tight mt-0.5">92%</span>
                    </div>
                </div>

                <!-- Rescan Interactive Button -->
                <button id="rescan-btn" class="mt-3 px-5 py-2 bg-[#1d1e24] hover:bg-[#272930] active:scale-95 text-xs font-semibold text-orange-400 rounded-full border border-orange-500/20 transition-all flex items-center gap-2">
                    <svg id="rescan-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span>Пересканировать</span>
                </button>
            </div>

            <!-- Device Security Status Panel -->
            <div class="bg-[#18191d] rounded-2xl p-4 border border-white/5 shadow-xl my-2">
                
                <!-- Status Header -->
                <div class="flex items-center gap-2.5 mb-2">
                    <div id="status-icon-bg" class="w-6 h-6 rounded-md bg-orange-500/20 flex items-center justify-center shrink-0">
                        <svg id="status-icon" class="w-3.5 h-3.5 text-orange-500" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4z"/>
                        </svg>
                    </div>
                    <h2 class="text-sm font-bold text-white tracking-wide">Статус безопасности устройства</h2>
                </div>

                <!-- Status Sub-label -->
                <div class="flex items-center gap-1.5 ml-8 mb-3">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
                    <span id="status-text" class="text-xs font-medium text-orange-400">Требуется внимание</span>
                </div>

                <!-- Evaluation Text -->
                <div class="ml-1 border-t border-white/5 pt-3">
                    <p class="text-[11px] text-gray-400 font-medium">Оценка безопасности</p>
                    <p id="security-rating-text" class="text-lg font-bold text-orange-400 mt-0.5">92% Безопасно</p>
                    <p id="apps-count-text" class="text-[11px] text-gray-400 mt-0.5">109 приложений под наблюдением</p>
                </div>

                <!-- Three App Categories Grid -->
                <div class="grid grid-cols-3 gap-2.5 mt-4">
                    
                    <!-- Dangerous Apps -->
                    <div class="bg-[#121316] p-2.5 rounded-xl border border-white/5 flex flex-col items-center justify-center text-center">
                        <div class="w-5 h-5 rounded-full bg-red-500/20 flex items-center justify-center mb-1">
                            <span class="w-2 h-2 rounded-full bg-red-500"></span>
                        </div>
                        <span id="dangerous-count" class="text-lg font-bold text-white">0</span>
                        <span class="text-[10px] text-gray-400 font-medium mt-0.5">Опасные</span>
                    </div>

                    <!-- Suspicious Apps -->
                    <div class="bg-[#121316] p-2.5 rounded-xl border border-white/5 flex flex-col items-center justify-center text-center">
                        <div class="w-5 h-5 rounded-full bg-orange-500/20 flex items-center justify-center mb-1">
                            <svg class="w-3 h-3 text-orange-500" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 5.99L19.53 19H4.47L12 5.99M12 2L1 21h22L12 2zm1 14h-2v2h2v-2zm0-6h-2v4h2v-4z"/>
                            </svg>
                        </div>
                        <span id="suspicious-count" class="text-lg font-bold text-orange-400">8</span>
                        <span class="text-[10px] text-gray-400 font-medium mt-0.5">Сомнительные</span>
                    </div>

                    <!-- Safe Apps -->
                    <div class="bg-[#121316] p-2.5 rounded-xl border border-white/5 flex flex-col items-center justify-center text-center">
                        <div class="w-5 h-5 rounded-full bg-emerald-500/20 flex items-center justify-center mb-1">
                            <svg class="w-3 h-3 text-emerald-500" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                            </svg>
                        </div>
                        <span id="safe-count" class="text-lg font-bold text-emerald-400">101</span>
                        <span class="text-[10px] text-gray-400 font-medium mt-0.5">Безопасные</span>
                    </div>

                </div>

            </div>

        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bg-[#141518] border-t border-white/5 px-4 py-2.5 flex justify-around items-center">
            
            <!-- Apps Tab -->
            <button class="nav-item flex flex-col items-center gap-1 text-gray-400 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                </svg>
                <span class="text-[10px] font-medium">Приложения</span>
            </button>

            <!-- Scan Tab (Active) -->
            <button class="nav-item flex flex-col items-center gap-1 text-orange-500">
                <div class="w-8 h-8 rounded-full bg-orange-500 flex items-center justify-center text-white shadow-lg shadow-orange-500/40 -mt-2 border-2 border-[#141518]">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4z"/>
                    </svg>
                </div>
                <span class="text-[10px] font-semibold text-orange-500">Проверка</span>
            </button>

            <!-- Memory Check Tab -->
            <button class="nav-item flex flex-col items-center gap-1 text-gray-400 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                </svg>
                <span class="text-[10px] font-medium">Проверка памяти</span>
            </button>

        </div>

    </div>

    <script>
        // DOM Elements
        const progressCircle = document.getElementById('progress-circle');
        const scorePercentageEl = document.getElementById('score-percentage');
        const securityRatingText = document.getElementById('security-rating-text');
        const appsCountText = document.getElementById('apps-count-text');
        const dangerousCountEl = document.getElementById('dangerous-count');
        const suspiciousCountEl = document.getElementById('suspicious-count');
        const safeCountEl = document.getElementById('safe-count');
        const rescanBtn = document.getElementById('rescan-btn');
        const rescanIcon = document.getElementById('rescan-icon');
        const pulseRing = document.getElementById('pulse-ring');
        const centerShield = document.getElementById('center-shield');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const statusIconBg = document.getElementById('status-icon-bg');
        const currentTimeEl = document.getElementById('current-time');

        // Update live time display
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            currentTimeEl.textContent = `${hours}:${minutes}`;
        }
        updateClock();
        setInterval(updateClock, 30000);

        // Circle Circumference = 2 * PI * r = 2 * 3.14159 * 42 = 263.89
        const CIRCUMFERENCE = 263.89;

        function setScoreProgress(percent) {
            const offset = CIRCUMFERENCE - (percent / 100) * CIRCUMFERENCE;
            progressCircle.style.strokeDashoffset = offset;
        }

        // Initialize default view (92%)
        setScoreProgress(92);

        let isScanning = false;

        // Rescan / Randomize functionality
        rescanBtn.addEventListener('click', () => {
            if (isScanning) return;
            isScanning = true;

            // Trigger visual scan feedback
            rescanIcon.classList.add('animate-spin');
            pulseRing.classList.add('scanning-pulse');
            centerShield.classList.add('scale-110');

            // Generate Random Values
            const totalApps = Math.floor(Math.random() * 70) + 80; // 80 to 150
            const dangerousApps = Math.random() < 0.3 ? Math.floor(Math.random() * 3) + 1 : 0; // 0 to 3
            const suspiciousApps = Math.floor(Math.random() * 12); // 0 to 11
            const safeApps = totalApps - dangerousApps - suspiciousApps;

            // Calculate realistic security score based on risks
            let calculatedScore = 100 - (dangerousApps * 18) - (suspiciousApps * 1.5);
            calculatedScore = Math.max(45, Math.min(100, Math.round(calculatedScore)));

            // Scanning state UI text
            scorePercentageEl.textContent = '...';
            securityRatingText.textContent = 'Сканирование...';
            securityRatingText.className = "text-lg font-bold text-gray-300 mt-0.5";

            // Animate counting numbers during scan
            let scanInterval = setInterval(() => {
                const tempScore = Math.floor(Math.random() * 40) + 60;
                setScoreProgress(tempScore);
            }, 100);

            // Finish scan after 1.8 seconds
            setTimeout(() => {
                clearInterval(scanInterval);
                isScanning = false;

                rescanIcon.classList.remove('animate-spin');
                pulseRing.classList.remove('scanning-pulse');
                centerShield.classList.remove('scale-110');

                // Set final values
                setScoreProgress(calculatedScore);
                scorePercentageEl.textContent = `${calculatedScore}%`;
                
                dangerousCountEl.textContent = dangerousApps;
                suspiciousCountEl.textContent = suspiciousApps;
                safeCountEl.textContent = safeApps;
                appsCountText.textContent = `${totalApps} приложений под наблюдением`;

                // Update UI based on final health status
                if (calculatedScore >= 95) {
                    securityRatingText.textContent = `${calculatedScore}% Отлично`;
                    securityRatingText.className = "text-lg font-bold text-emerald-400 mt-0.5";
                    statusText.textContent = "Устройство в безопасности";
                    statusText.className = "text-xs font-medium text-emerald-400";
                    statusDot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                    statusIconBg.className = "w-6 h-6 rounded-md bg-emerald-500/20 flex items-center justify-center shrink-0";
                } else if (calculatedScore >= 80) {
                    securityRatingText.textContent = `${calculatedScore}% Безопасно`;
                    securityRatingText.className = "text-lg font-bold text-orange-400 mt-0.5";
                    statusText.textContent = "Требуется внимание";
                    statusText.className = "text-xs font-medium text-orange-400";
                    statusDot.className = "w-2 h-2 rounded-full bg-orange-500 animate-pulse";
                    statusIconBg.className = "w-6 h-6 rounded-md bg-orange-500/20 flex items-center justify-center shrink-0";
                } else {
                    securityRatingText.textContent = `${calculatedScore}% Риск обнаружен`;
                    securityRatingText.className = "text-lg font-bold text-red-500 mt-0.5";
                    statusText.textContent = "Обнаружена угроза!";
                    statusText.className = "text-xs font-medium text-red-500";
                    statusDot.className = "w-2 h-2 rounded-full bg-red-500 animate-ping";
                    statusIconBg.className = "w-6 h-6 rounded-md bg-red-500/20 flex items-center justify-center shrink-0";
                }

            }, 1800);
        });

        // Tab click interactions
        document.querySelectorAll('.nav-item').forEach((tab) => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(t => {
                    t.classList.remove('text-orange-500');
                    t.classList.add('text-gray-400');
                });
                this.classList.remove('text-gray-400');
                this.classList.add('text-orange-500');
            });
        });
    </script>
</body>
</html>
